<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>医疗报告助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🩺 医疗报告助手</h1>
            <div class="auth-area" id="authArea"></div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <p>👋 欢迎使用医疗报告助手</p>
                <p class="welcome-sub">上传医疗检测报告图片 → AI 读取异常指标 → 生成健康建议，全程流式实时展示。</p>
            </div>
        </div>
        
        <div class="input-container">
            <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
                <img id="imagePreview" src="" alt="Image preview">
                <button class="remove-image-btn" id="removeImageBtn">×</button>
            </div>
            
            <div class="input-area">
                <label for="imageInput" class="image-input-label" id="imageInputLabel">
                    <span class="plus-icon">+</span>
                    <span>选择图片</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <button id="sendButton" class="send-button" disabled>发送</button>
            </div>
        </div>
    </div>
    
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
